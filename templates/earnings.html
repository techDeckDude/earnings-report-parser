<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earnings Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0a' rx='5'/><rect x='5' y='5' width='10' height='10' fill='none' stroke='%2300e664' stroke-width='1.5' rx='1'/><rect x='17' y='5' width='10' height='10' fill='%2300e664' rx='1' opacity='0.4'/><rect x='5' y='17' width='10' height='10' fill='%2300e664' rx='1' opacity='0.7'/><rect x='17' y='17' width='10' height='10' fill='%2300e664' rx='1'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  {% if static_build %}<script>window.API_EXT = ".json";</script>{% endif %}
  <script>(function(){var t=localStorage.getItem('theme');if(t==='light')document.documentElement.dataset.theme='light';})()</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--bg); }

    :root {
      --green:           #00e664;
      --green-dim:       rgba(0, 230, 100, 0.12);
      --green-line:      rgba(0, 230, 100, 0.18);
      --bg:              #0a0a0a;
      --bg-card:         rgba(255, 255, 255, 0.03);
      --border:          rgba(255, 255, 255, 0.07);
      --text-1:          #f0f0f0;
      --text-2:          #999;
      --text-3:          #555;
      --grid-color:      rgba(0, 255, 100, 0.03);
      --vignette-color:  rgba(0, 0, 0, 0.55);
    }

    :root[data-theme="light"] {
      --green:           #007a35;
      --green-dim:       rgba(0, 122, 53, 0.10);
      --green-line:      rgba(0, 122, 53, 0.22);
      --bg:              #f2f1ec;
      --bg-card:         rgba(0, 0, 0, 0.025);
      --border:          rgba(0, 0, 0, 0.09);
      --text-1:          #0e0e0e;
      --text-2:          #444;
      --text-3:          #888;
      --grid-color:      rgba(0, 60, 20, 0.05);
      --vignette-color:  rgba(242, 241, 236, 0.5);
    }

    body {
      font-family: "IBM Plex Sans", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      padding: 40px 32px;
      max-width: 940px;
      margin: 0 auto;
    }

    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: "";
      position: fixed; inset: 0;
      background: radial-gradient(transparent 40%, var(--vignette-color) 100%);
      pointer-events: none; z-index: 0;
    }

    .topnav, .page-header, .ticker-selector, .card, #tooltip {
      position: relative; z-index: 1;
    }

    /* ── Nav ── */
    .topnav {
      display: flex; align-items: center; gap: 4px;
      border-bottom: 0.5px solid var(--border);
      margin: -40px -32px 40px;
      padding: 0 32px;
      background: var(--bg);
      position: sticky; top: 0; z-index: 100;
    }
    .topnav a {
      display: block; padding: 14px 18px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.06em;
      color: var(--text-3); text-decoration: none;
      border-bottom: 1px solid transparent; margin-bottom: -1px;
      transition: color 0.12s;
    }
    .topnav a:hover { color: var(--text-2); }
    .topnav a.active { color: var(--green); border-bottom-color: var(--green); }
    .theme-toggle {
      margin-left: auto;
      background: none; border: 0.5px solid var(--border);
      color: var(--text-3); cursor: pointer;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem; font-weight: 500; letter-spacing: 0.08em;
      padding: 5px 10px; border-radius: 3px;
      transition: color 0.12s, border-color 0.12s;
    }
    .theme-toggle:hover { color: var(--text-2); border-color: var(--text-3); }

    /* ── Header ── */
    .page-header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
    h1 {
      font-family: "IBM Plex Mono", monospace;
      font-size: 1.75rem; font-weight: 600;
      color: var(--text-1); letter-spacing: -0.02em;
    }
    .company-name {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem; color: var(--text-3);
      letter-spacing: 0.08em; text-transform: uppercase;
    }

    /* ── Ticker selector ── */
    .ticker-selector {
      display: flex; gap: 8px; flex-wrap: nowrap;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; margin-bottom: 32px; padding-bottom: 2px;
    }
    .ticker-selector::-webkit-scrollbar { display: none; }
    .ticker-btn {
      background: var(--bg-card); color: var(--text-3);
      border: 0.5px solid var(--border);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem; font-weight: 600;
      padding: 5px 14px; border-radius: 4px; letter-spacing: 0.06em;
      cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .ticker-btn.active { background: var(--green-dim); color: var(--green); border-color: var(--green-line); }
    .ticker-btn:hover:not(.active) { background: rgba(255,255,255,0.05); color: var(--text-2); border-color: rgba(255,255,255,0.12); }

    /* ── Cards ── */
    .card {
      background: var(--bg-card); border: 0.5px solid var(--border);
      border-radius: 6px; padding: 24px 28px; margin-bottom: 20px;
    }
    .card-title {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 20px;
    }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 0.82rem; }

    th {
      text-align: right; padding: 8px 16px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-3); border-bottom: 0.5px solid var(--border);
      white-space: nowrap; min-width: 88px;
    }
    th.label-col { text-align: left; min-width: 180px; width: 180px; }

    .group-row td {
      padding: 16px 16px 6px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.6rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-3); background: rgba(0, 0, 0, 0.3);
    }

    tbody tr.metric-row { cursor: pointer; }
    tbody tr.metric-row:hover td { background: rgba(255,255,255,0.03); }
    tbody tr.metric-row.selected td { background: var(--green-dim); }
    tbody tr.metric-row.selected td.label-cell { color: var(--green); }

    td { padding: 10px 16px; border-bottom: 0.5px solid rgba(255,255,255,0.04); color: var(--text-2); white-space: nowrap; }
    td.label-cell { color: var(--text-2); font-weight: 400; min-width: 180px; width: 180px; }
    td.num-cell { text-align: right; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; color: var(--text-1); min-width: 88px; }
    td.null-cell { text-align: right; font-family: "IBM Plex Mono", monospace; color: var(--text-3); min-width: 88px; }
    td.derived-cell { text-align: right; font-family: "IBM Plex Mono", monospace; color: var(--green); font-variant-numeric: tabular-nums; min-width: 88px; }

    /* ── Chart section ── */
    .chart-section { display: flex; flex-direction: column; gap: 16px; }
    .metric-pills {
      display: flex; flex-wrap: nowrap; gap: 6px; align-items: center;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; padding-bottom: 2px;
    }
    .metric-pills::-webkit-scrollbar { display: none; }
    .pill-group-sep { width: 0.5px; height: 16px; background: var(--border); margin: 0 2px; flex-shrink: 0; }

    .pill-btn {
      background: var(--bg-card); border: 0.5px solid var(--border);
      text-align: center; padding: 4px 12px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem; color: var(--text-3);
      border-radius: 4px; cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s; white-space: nowrap;
    }
    .pill-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-2); border-color: rgba(255,255,255,0.12); }
    .pill-btn.active { background: var(--green-dim); color: var(--green); border-color: var(--green-line); font-weight: 600; }

    .chart-wrap { min-width: 0; }
    .chart-title {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.04em;
      color: var(--text-2); margin-bottom: 12px;
    }

    /* ── Chart scroll (news-page pattern) ── */
    .chart-flex { display: flex; align-items: flex-start; }
    .chart-scroll-inner {
      flex: 1; min-width: 0;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .chart-scroll-inner::-webkit-scrollbar { display: none; }
    .chart-scroll-hint {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.6rem; color: var(--text-3);
      letter-spacing: 0.06em; text-align: center; margin-top: 6px;
    }
    .axis-label { font-size: 10px; fill: var(--text-3); font-family: "IBM Plex Mono", monospace; }
    .grid-line { stroke: var(--border); stroke-width: 1; }
    .chart-line { fill: none; stroke: var(--green); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .chart-dot { fill: var(--green); stroke: var(--bg); stroke-width: 2; cursor: pointer; }
    .chart-dot:hover { r: 7; }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed; background: #0d0d0d;
      border: 0.5px solid var(--border); border-radius: 6px;
      padding: 10px 14px;
      font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
      pointer-events: none; opacity: 0; transition: opacity 0.1s; z-index: 100;
    }
    #tooltip .tt-period { color: var(--text-3); font-size: 0.62rem; margin-bottom: 2px; }
    #tooltip .tt-val { color: var(--green); font-weight: 600; font-size: 0.88rem; }

    .empty { color: var(--text-3); font-size: 0.875rem; padding: 40px 0; text-align: center; }

    /* ── Mobile ─────────────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      body { padding: 20px 16px; }

      .topnav {
        margin: -20px -16px 20px;
        padding: 0 12px;
      }
      .topnav a { padding: 12px 14px; }

      h1 { font-size: 1.3rem; }
      .page-header { margin-bottom: 18px; gap: 8px; }

      /* Tighter spacing on small screens */
      .ticker-selector { margin-bottom: 20px; }
      .ticker-btn { padding: 5px 11px; }
      .card { padding: 14px 14px; margin-bottom: 12px; }

      /* Table: tighter label + data columns */
      td.label-cell, th.label-col { min-width: 130px; width: 130px; font-size: 0.78rem; }
      td.num-cell, td.null-cell, td.derived-cell { min-width: 72px; font-size: 0.78rem; }
      th:not(.label-col) { min-width: 72px; }
      td { padding: 8px 10px; }
      td.label-cell { padding: 8px 10px; }
    }
  </style>
</head>
<body>

  <nav class="topnav">
    <a href="/" class="active">Earnings</a>
    <a href="/news">News</a>
    <button class="theme-toggle" id="themeToggle">◐ LIGHT</button>
  </nav>

  <div class="page-header">
    <h1 id="pageTitle">Stock Detail</h1>
    <span class="company-name" id="companyName"></span>
  </div>

  <div class="ticker-selector" id="tickerSelector"></div>

  <!-- Chart -->
  <div class="card">
    <div class="card-title">Metric Chart</div>
    <div class="chart-section">
      <div class="metric-pills" id="metricPills"></div>
      <div class="chart-wrap">
        <div class="chart-title" id="chartTitle">—</div>
        <div id="chartContainer"></div>
      </div>
    </div>
  </div>

  <!-- Metrics Table -->
  <div class="card">
    <div class="card-title">Quarterly Metrics</div>
    <div class="table-wrap">
      <table id="metricsTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"><tr><td class="empty">Select a ticker above.</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="tooltip">
    <div class="tt-period" id="ttPeriod"></div>
    <div class="tt-val" id="ttVal"></div>
  </div>

<script>
// Theme toggle
(function() {
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  function syncLabel() {
    btn.textContent = root.dataset.theme === 'light' ? '◑ DARK' : '◐ LIGHT';
  }
  syncLabel();
  btn.addEventListener('click', function() {
    const isLight = root.dataset.theme === 'light';
    root.dataset.theme = isLight ? 'dark' : 'light';
    localStorage.setItem('theme', isLight ? 'dark' : 'light');
    syncLabel();
  });
})();

// ── Metric definitions ────────────────────────────────────────────────────────

const GROUPS = [
  {
    label: "Income Statement",
    metrics: [
      { id: "revenue",           stmt: "income_statement", field: "revenue",                         label: "Revenue",              fmt: "money" },
      { id: "cost_of_revenue",   stmt: "income_statement", field: "cost_of_revenue",                 label: "Cost of Revenue",      fmt: "money" },
      { id: "gross_profit",      stmt: "income_statement", field: "gross_profit",                    label: "Gross Profit",         fmt: "money" },
      { id: "gross_margin",      derived: true,                                                       label: "Gross Margin",         fmt: "pct"   },
      { id: "rd",                stmt: "income_statement", field: "research_and_development",        label: "R&D",                  fmt: "money" },
      { id: "sm",                stmt: "income_statement", field: "sales_and_marketing",             label: "Sales & Marketing",    fmt: "money" },
      { id: "ga",                stmt: "income_statement", field: "general_and_administrative",      label: "G&A",                  fmt: "money" },
      { id: "sga",               stmt: "income_statement", field: "selling_general_and_administrative", label: "SG&A",             fmt: "money" },
      { id: "total_opex",        stmt: "income_statement", field: "total_operating_expenses",        label: "Total Opex",           fmt: "money" },
      { id: "op_income",         stmt: "income_statement", field: "income_from_operations",          label: "Operating Income",     fmt: "money" },
      { id: "net_income",        stmt: "income_statement", field: "net_income",                      label: "Net Income",           fmt: "money" },
      { id: "eps_basic",         stmt: "income_statement", field: "eps_basic",                       label: "EPS (Basic)",          fmt: "eps"   },
      { id: "eps_diluted",       stmt: "income_statement", field: "eps_diluted",                     label: "EPS (Diluted)",        fmt: "eps"   },
    ],
  },
  {
    label: "Balance Sheet",
    metrics: [
      { id: "cash",              stmt: "balance_sheet",    field: "cash_and_equivalents",            label: "Cash & Equivalents",   fmt: "money" },
      { id: "mkt_sec",           stmt: "balance_sheet",    field: "marketable_securities",           label: "Marketable Securities",fmt: "money" },
      { id: "ar",                stmt: "balance_sheet",    field: "accounts_receivable_net",         label: "Accounts Receivable",  fmt: "money" },
      { id: "cur_assets",        stmt: "balance_sheet",    field: "total_current_assets",            label: "Total Current Assets", fmt: "money" },
      { id: "total_assets",      stmt: "balance_sheet",    field: "total_assets",                    label: "Total Assets",         fmt: "money" },
      { id: "cur_liab",          stmt: "balance_sheet",    field: "total_current_liabilities",       label: "Current Liabilities",  fmt: "money" },
      { id: "total_liab",        stmt: "balance_sheet",    field: "total_liabilities",               label: "Total Liabilities",    fmt: "money" },
      { id: "equity",            stmt: "balance_sheet",    field: "total_equity",                    label: "Total Equity",         fmt: "money" },
    ],
  },
  {
    label: "Cash Flow",
    metrics: [
      { id: "op_cf",             stmt: "cash_flow",        field: "net_cash_from_operations",        label: "Operating Cash Flow",  fmt: "money" },
      { id: "capex",             stmt: "cash_flow",        field: "capex",                           label: "CapEx",                fmt: "money" },
      { id: "fcf",               derived: true,                                                       label: "Free Cash Flow",       fmt: "money" },
      { id: "inv_cf",            stmt: "cash_flow",        field: "net_cash_from_investing",         label: "Investing Cash Flow",  fmt: "money" },
      { id: "fin_cf",            stmt: "cash_flow",        field: "net_cash_from_financing",         label: "Financing Cash Flow",  fmt: "money" },
      { id: "sbc",               stmt: "cash_flow",        field: "stock_based_compensation",        label: "Stock-Based Comp",     fmt: "money" },
    ],
  },
];

const ALL_METRICS = GROUPS.flatMap(g => g.metrics);
const BY_ID = Object.fromEntries(ALL_METRICS.map(m => [m.id, m]));

// ── Formatting ────────────────────────────────────────────────────────────────

function fmtMoney(thousands) {
  if (thousands === null || thousands === undefined) return null;
  const b = thousands / 1_000_000;
  const m = thousands / 1_000;
  if (Math.abs(b) >= 1)  return (b >= 0 ? "" : "-") + "$" + Math.abs(b).toFixed(2) + "B";
  if (Math.abs(m) >= 1)  return (m >= 0 ? "" : "-") + "$" + Math.abs(m).toFixed(0) + "M";
  return (thousands >= 0 ? "" : "-") + "$" + Math.abs(thousands).toFixed(0) + "K";
}

function fmtEps(v) {
  if (v === null || v === undefined) return null;
  return (v >= 0 ? "$" : "-$") + Math.abs(v).toFixed(2);
}

function fmtPct(v) {
  if (v === null || v === undefined) return null;
  return v.toFixed(1) + "%";
}

function fmt(m, v) {
  if (v === null || v === undefined) return null;
  if (m.fmt === "money") return fmtMoney(v);
  if (m.fmt === "eps")   return fmtEps(v);
  if (m.fmt === "pct")   return fmtPct(v);
  return v;
}

function fmtForChart(metricId, v) {
  const m = BY_ID[metricId];
  if (!m) return String(v);
  return fmt(m, v) || String(v);
}

// ── Derived metrics ───────────────────────────────────────────────────────────

function deriveValues(metricId, data, n) {
  const get = (stmt, field) => {
    return (data[stmt] && data[stmt][field]) ? data[stmt][field] : Array(n).fill(null);
  };
  if (metricId === "gross_margin") {
    const rev = get("income_statement", "revenue");
    const gp  = get("income_statement", "gross_profit");
    return rev.map((r, i) => (r && gp[i] !== null) ? (gp[i] / r * 100) : null);
  }
  if (metricId === "fcf") {
    const ops  = get("cash_flow", "net_cash_from_operations");
    const cap  = get("cash_flow", "capex");
    return ops.map((o, i) => (o !== null && cap[i] !== null) ? o - cap[i] : null);
  }
  return Array(n).fill(null);
}

function getValues(metricDef, data, n) {
  if (metricDef.derived) return deriveValues(metricDef.id, data, n);
  const vals = data[metricDef.stmt] && data[metricDef.stmt][metricDef.field];
  return vals || Array(n).fill(null);
}

// ── State ─────────────────────────────────────────────────────────────────────

const API_EXT = window.API_EXT || "";
let activeTicker = null;
let stockData    = null;
let selectedMetricId = "revenue";

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  const tickers = await fetch(`/api/tickers${API_EXT}`).then(r => r.json());
  buildTickerSelector(tickers);

  // Check URL param
  const params = new URLSearchParams(location.search);
  const t = params.get("ticker");
  const first = t || (tickers[0] && tickers[0].ticker);
  if (first) selectTicker(first);
}

function buildTickerSelector(tickers) {
  const el = document.getElementById("tickerSelector");
  el.innerHTML = tickers.map(t =>
    `<button class="ticker-btn" data-ticker="${t.ticker}" onclick="selectTicker('${t.ticker}')">${t.ticker}</button>`
  ).join("");
}

async function selectTicker(ticker) {
  activeTicker = ticker;
  document.querySelectorAll(".ticker-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.ticker === ticker)
  );
  const activeBtn = document.querySelector(".ticker-btn.active");
  if (activeBtn) activeBtn.scrollIntoView({ block: "nearest", inline: "center" });
  history.replaceState(null, "", `?ticker=${ticker}`);

  stockData = await fetch(`/api/metrics/${ticker}${API_EXT}`).then(r => r.json());

  document.getElementById("pageTitle").textContent = stockData.ticker;
  document.getElementById("companyName").textContent = stockData.name;

  buildTable();
  buildPills();
  selectMetric(selectedMetricId);
}

// ── Table ─────────────────────────────────────────────────────────────────────

function buildTable() {
  const { periods, data } = stockData;
  const n = periods.length;

  // Header
  const head = document.getElementById("tableHead");
  head.innerHTML = `<tr>
    <th class="label-col">Metric</th>
    ${periods.map(p => `<th>${p.period}</th>`).join("")}
  </tr>`;

  // Body
  const tbody = document.getElementById("tableBody");
  let html = "";

  for (const group of GROUPS) {
    html += `<tr class="group-row"><td colspan="${n + 1}">${group.label}</td></tr>`;

    for (const m of group.metrics) {
      const vals = getValues(m, data, n);
      const hasAny = vals.some(v => v !== null);
      if (!hasAny) continue; // skip metrics this company doesn't have

      const cells = vals.map(v => {
        const display = fmt(m, v);
        if (display === null) return `<td class="null-cell">—</td>`;
        if (m.derived) return `<td class="derived-cell">${display}</td>`;
        return `<td class="num-cell">${display}</td>`;
      }).join("");

      html += `<tr class="metric-row" id="row-${m.id}" onclick="selectMetric('${m.id}')">
        <td class="label-cell">${m.label}</td>
        ${cells}
      </tr>`;
    }
  }

  tbody.innerHTML = html;
  highlightRow(selectedMetricId);
}

function highlightRow(metricId) {
  document.querySelectorAll(".metric-row").forEach(r => r.classList.remove("selected"));
  const row = document.getElementById(`row-${metricId}`);
  if (row) row.classList.add("selected");
}

// ── Metric pills ──────────────────────────────────────────────────────────────

function buildPills() {
  const { data } = stockData;
  const n = stockData.periods.length;
  let html = "";
  let firstGroup = true;

  for (const group of GROUPS) {
    const available = group.metrics.filter(m => getValues(m, data, n).some(v => v !== null));
    if (!available.length) continue;
    if (!firstGroup) html += `<div class="pill-group-sep"></div>`;
    firstGroup = false;
    for (const m of available) {
      html += `<button class="pill-btn" id="pill-${m.id}" onclick="selectMetric('${m.id}')">${m.label}</button>`;
    }
  }

  document.getElementById("metricPills").innerHTML = html;
}

function highlightPill(metricId) {
  document.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
  const pill = document.getElementById(`pill-${metricId}`);
  if (pill) { pill.classList.add("active"); pill.scrollIntoView({ block: "nearest", inline: "center" }); }
}

// ── Select metric ─────────────────────────────────────────────────────────────

function selectMetric(metricId) {
  const m = BY_ID[metricId];
  if (!m) return;

  // Check if available for this ticker
  const vals = getValues(m, stockData.data, stockData.periods.length);
  if (!vals.some(v => v !== null)) return;

  selectedMetricId = metricId;
  highlightRow(metricId);
  highlightPill(metricId);
  document.getElementById("chartTitle").textContent = m.label;
  drawChart(vals, m);
}

// ── Chart ─────────────────────────────────────────────────────────────────────

function drawChart(vals, metricDef) {
  const periods = stockData.periods;
  const container = document.getElementById("chartContainer");

  const containerW = Math.max(260, Math.floor(container.getBoundingClientRect().width));
  const mobile = containerW < 520;
  const H = mobile ? 260 : 220;
  const PAD = { top: 16, right: mobile ? 12 : 20, bottom: mobile ? 48 : 44, left: 68 };
  const dotR = mobile ? 7 : 5;

  // Filter out null entries
  const points = vals.map((v, i) => ({ v, p: periods[i] })).filter(x => x.v !== null);
  if (!points.length) {
    container.innerHTML = `<svg style="width:100%;display:block" height="${H}">
      <text x="50%" y="50%" text-anchor="middle" fill="#444" font-size="13" font-family="IBM Plex Mono, monospace">No data</text>
    </svg>`;
    return;
  }

  // Ensure minimum spacing per quarter so dots are never squished
  const MIN_SPACING = Math.max(44, Math.ceil(containerW / 8));
  const W = Math.max(containerW, points.length * MIN_SPACING);
  const scrollable = W > containerW;

  const IW = W - PAD.left - PAD.right;
  const IH = H - PAD.top - PAD.bottom;

  const rawVals = points.map(x => x.v);
  const minV = Math.min(...rawVals);
  const maxV = Math.max(...rawVals);
  const pad  = (maxV - minV) * 0.15 || Math.abs(maxV) * 0.1 || 1;
  const yMin = minV - pad;
  const yMax = maxV + pad;

  function xPos(i) {
    return PAD.left + (points.length === 1 ? IW / 2 : (i / (points.length - 1)) * IW);
  }
  function yPos(v) {
    return PAD.top + IH - ((v - yMin) / (yMax - yMin)) * IH;
  }

  // Grid + y-labels
  let grid = "", yLabels = "";
  const yTicks = 4;
  for (let i = 0; i <= yTicks; i++) {
    const v = yMin + (i / yTicks) * (yMax - yMin);
    const y = yPos(v);
    grid    += `<line class="grid-line" x1="${PAD.left}" y1="${y}" x2="${W - PAD.right}" y2="${y}" />`;
    yLabels += `<text class="axis-label" x="${PAD.left - 8}" y="${y + 4}" text-anchor="end">${fmt(metricDef, v) || v.toFixed(1)}</text>`;
  }

  // X-labels: show every Nth so they don't overlap
  const step = points.length <= 12 ? 1 : Math.ceil(points.length / 12);
  let xLabels = "";
  points.forEach((pt, i) => {
    if (i % step !== 0 && i !== points.length - 1) return;
    xLabels += `<text class="axis-label" x="${xPos(i)}" y="${H - PAD.bottom + 16}" text-anchor="middle">${pt.p.period}</text>`;
  });

  // Line + dots
  const path = points.map((pt, i) => `${i === 0 ? "M" : "L"} ${xPos(i)},${yPos(pt.v)}`).join(" ");
  const dots = points.map((pt, i) =>
    `<circle class="chart-dot" cx="${xPos(i)}" cy="${yPos(pt.v)}" r="${dotR}"
      onmouseenter="showTip(event,'${pt.p.period}','${fmt(metricDef, pt.v)}')"
      onmouseleave="hideTip()" />`
  ).join("");

  const chartContent = `${grid}${xLabels}<path class="chart-line" d="${path}" />${dots}`;

  if (scrollable) {
    // Fixed y-axis SVG + scrollable chart SVG (news page pattern)
    const rightW = W - PAD.left;
    container.innerHTML = `
      <div class="chart-flex">
        <svg aria-hidden="true" style="display:block;flex-shrink:0;border-right:0.5px solid var(--border)"
             width="${PAD.left}" height="${H}" viewBox="0 0 ${PAD.left} ${H}">
          ${yLabels}
        </svg>
        <div class="chart-scroll-inner">
          <svg viewBox="${PAD.left} 0 ${rightW} ${H}"
               style="width:${rightW}px;min-width:${rightW}px;display:block;overflow:visible">
            ${chartContent}
          </svg>
        </div>
      </div>
      <div class="chart-scroll-hint">← scroll →</div>`;
  } else {
    container.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block;overflow:visible">
        ${yLabels}${chartContent}
      </svg>`;
  }
}

// ── Tooltip ───────────────────────────────────────────────────────────────────

function showTip(e, period, val) {
  document.getElementById("ttPeriod").textContent = period;
  document.getElementById("ttVal").textContent = val;
  const tip = document.getElementById("tooltip");
  tip.style.opacity = "1";
  tip.style.left = (e.clientX + 14) + "px";
  tip.style.top  = (e.clientY - 36) + "px";
}
function hideTip() { document.getElementById("tooltip").style.opacity = "0"; }
document.getElementById("chartContainer").addEventListener("mousemove", e => {
  const tip = document.getElementById("tooltip");
  if (tip.style.opacity === "1") {
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top  = (e.clientY - 36) + "px";
  }
});

init();

let _chartResizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(_chartResizeTimer);
  _chartResizeTimer = setTimeout(() => {
    const active = document.querySelector('.pill.active');
    if (active) active.click();
  }, 150);
});
</script>
