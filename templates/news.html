<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market News</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0a' rx='5'/><rect x='5' y='5' width='10' height='10' fill='none' stroke='%2300e664' stroke-width='1.5' rx='1'/><rect x='17' y='5' width='10' height='10' fill='%2300e664' rx='1' opacity='0.4'/><rect x='5' y='17' width='10' height='10' fill='%2300e664' rx='1' opacity='0.7'/><rect x='17' y='17' width='10' height='10' fill='%2300e664' rx='1'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  {% if static_build %}<script>window.API_EXT = ".json";</script>{% endif %}
  <script>(function(){var t=localStorage.getItem('theme');if(t==='light')document.documentElement.dataset.theme='light';})()</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--bg); }

    :root {
      --green:           #00e664;
      --green-dim:       rgba(0, 230, 100, 0.12);
      --green-line:      rgba(0, 230, 100, 0.18);
      --bg:              #0a0a0a;
      --bg-card:         rgba(255, 255, 255, 0.03);
      --border:          rgba(255, 255, 255, 0.07);
      --text-1:          #f0f0f0;
      --text-2:          #999;
      --text-3:          #555;
      --grid-color:      rgba(0, 255, 100, 0.03);
      --vignette-color:  rgba(0, 0, 0, 0.55);
      --tooltip-bg:      #161616;
    }

    :root[data-theme="light"] {
      --green:           #007a35;
      --green-dim:       rgba(0, 122, 53, 0.10);
      --green-line:      rgba(0, 122, 53, 0.22);
      --bg:              #f2f1ec;
      --bg-card:         rgba(0, 0, 0, 0.025);
      --border:          rgba(0, 0, 0, 0.09);
      --text-1:          #0e0e0e;
      --text-2:          #444;
      --text-3:          #888;
      --grid-color:      rgba(0, 60, 20, 0.05);
      --vignette-color:  rgba(242, 241, 236, 0.5);
      --tooltip-bg:      #ffffff;
    }

    body {
      font-family: "IBM Plex Sans", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      padding: 40px 32px;
      max-width: 940px;
      margin: 0 auto;
    }

    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: "";
      position: fixed; inset: 0;
      background: radial-gradient(transparent 40%, var(--vignette-color) 100%);
      pointer-events: none; z-index: 0;
    }

    .topnav, h1, .carousel-nav, .report-meta, .stats-row, .chart-card, .feed, #chartTooltip {
      position: relative; z-index: 1;
    }

    /* ── Nav ── */
    .topnav {
      display: flex; align-items: center; gap: 4px;
      border-bottom: 0.5px solid var(--border);
      margin: -40px -32px 40px; padding: 0 32px;
      background: var(--bg);
      position: sticky; top: 0; z-index: 100;
    }
    .topnav a {
      display: block; padding: 14px 18px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.06em;
      color: var(--text-3); text-decoration: none;
      border-bottom: 1px solid transparent; margin-bottom: -1px;
      transition: color 0.12s;
    }
    .topnav a:hover { color: var(--text-2); }
    .topnav a.active { color: var(--green); border-bottom-color: var(--green); }
    .theme-toggle {
      margin-left: auto;
      background: none; border: 0.5px solid var(--border);
      color: var(--text-3); cursor: pointer;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem; font-weight: 500; letter-spacing: 0.08em;
      padding: 5px 10px; border-radius: 3px;
      transition: color 0.12s, border-color 0.12s;
    }
    .theme-toggle:hover { color: var(--text-2); border-color: var(--text-3); }

    h1 {
      font-family: "IBM Plex Mono", monospace;
      font-size: 1.75rem; font-weight: 600;
      color: var(--text-1); letter-spacing: -0.02em; margin-bottom: 16px;
    }

    /* ── Carousel nav ── */
    .carousel-nav {
      display: flex; align-items: center; gap: 0;
      margin-bottom: 8px;
      border: 0.5px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      font-family: "IBM Plex Mono", monospace;
    }
    .carousel-nav .nav-btn {
      background: var(--bg-card);
      border: none; border-right: 0.5px solid var(--border);
      color: var(--text-2); cursor: pointer;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem; font-weight: 500; letter-spacing: 0.08em;
      padding: 10px 18px;
      transition: color 0.12s, background 0.12s;
      white-space: nowrap;
      user-select: none;
    }
    .carousel-nav .nav-btn:last-child {
      border-right: none; border-left: 0.5px solid var(--border);
    }
    .carousel-nav .nav-btn:hover:not(:disabled) { color: var(--green); background: var(--green-dim); }
    .carousel-nav .nav-btn:disabled { color: var(--text-3); cursor: default; }
    .carousel-nav .week-info {
      flex: 1; text-align: center; padding: 10px 12px;
    }
    .week-label {
      font-size: 0.75rem; font-weight: 600; color: var(--text-1);
      letter-spacing: 0.02em;
    }
    .week-counter {
      font-size: 0.6rem; color: var(--text-3); letter-spacing: 0.06em;
      margin-top: 2px;
    }

    .report-meta {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem; color: var(--text-3);
      letter-spacing: 0.04em; margin-bottom: 28px;
    }

    /* ── Carousel content transition ── */
    #carouselContent {
      transition: opacity 0.18s ease;
    }
    #carouselContent.fading {
      opacity: 0;
    }

    /* ── Stats ── */
    .stats-row { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
    .stat-chip {
      background: var(--bg-card); border: 0.5px solid var(--border);
      border-radius: 6px; padding: 10px 18px;
      font-family: "IBM Plex Mono", monospace; font-size: 0.68rem;
    }
    .stat-chip .stat-val { font-size: 1.2rem; font-weight: 600; color: var(--text-1); }
    .stat-chip .stat-lbl { color: var(--text-3); margin-top: 2px; letter-spacing: 0.04em; }
    .stat-chip.very-positive .stat-val { color: var(--green); }
    .stat-chip.positive .stat-val     { color: rgba(0,230,100,0.7); }
    .stat-chip.neutral .stat-val      { color: var(--text-2); }
    .stat-chip.negative .stat-val     { color: #f97316; }
    .stat-chip.very-negative .stat-val{ color: #ef4444; }

    /* ── Chart card ── */
    .chart-card {
      background: var(--bg-card); border: 0.5px solid var(--border);
      border-radius: 6px; padding: 24px 28px 20px;
      margin-bottom: 20px;
    }
    .chart-card-title {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-3); margin-bottom: 16px;
    }
    .axis-label { font-size: 10px; fill: var(--text-3); font-family: "IBM Plex Mono", monospace; }
    .grid-line { stroke: var(--border); stroke-width: 1; }
    .zero-line { stroke: rgba(255,255,255,0.15); stroke-width: 1; stroke-dasharray: 4 3; }

    /* ── Feed ── */
    .feed { width: 100%; }

    .headline-card {
      background: var(--bg-card); border: 0.5px solid var(--border);
      border-radius: 6px; padding: 20px 24px; margin-bottom: 10px;
      transition: border-color 0.15s;
    }
    .headline-card:hover { border-color: rgba(255,255,255,0.12); }
    .headline-card.s2  { border-left: 2px solid var(--green); }
    .headline-card.s1  { border-left: 2px solid rgba(0,230,100,0.45); }
    .headline-card.s0  { border-left: 2px solid var(--text-3); }
    .headline-card.sn1 { border-left: 2px solid #f97316; }
    .headline-card.sn2 { border-left: 2px solid #ef4444; }

    .headline-top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; margin-bottom: 6px;
    }
    .headline-text { font-size: 0.88rem; font-weight: 500; color: var(--text-1); line-height: 1.45; flex: 1; }
    .headline-text a { color: inherit; text-decoration: none; }
    .headline-text a:hover { color: var(--green); }

    /* ── Sentiment pills ── */
    .sentiment-pill {
      font-family: "IBM Plex Mono", monospace;
      padding: 2px 9px; border-radius: 4px;
      font-weight: 500; font-size: 0.62rem; letter-spacing: 0.06em;
      white-space: nowrap; flex-shrink: 0;
    }
    .pill-s2  { background: var(--green-dim); color: var(--green);             border: 0.5px solid var(--green-line); }
    .pill-s1  { background: var(--green-dim); color: rgba(0,230,100,0.7);      border: 0.5px solid rgba(0,230,100,0.25); }
    .pill-s0  { background: rgba(255,255,255,0.04); color: var(--text-2);       border: 0.5px solid var(--border); }
    .pill-sn1 { background: rgba(249,115,22,0.1);  color: #f97316;             border: 0.5px solid rgba(249,115,22,0.3); }
    .pill-sn2 { background: rgba(239,68,68,0.1);   color: #ef4444;             border: 0.5px solid rgba(239,68,68,0.3); }

    .headline-source {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem; color: var(--text-3);
      margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
      letter-spacing: 0.04em;
    }
    .unverified-badge {
      font-size: 0.6rem; color: #92400e;
      background: rgba(120,53,15,0.15); border: 0.5px solid rgba(120,53,15,0.4);
      border-radius: 3px; padding: 1px 6px;
    }
    .headline-summary { font-size: 0.8rem; color: var(--text-2); line-height: 1.55; margin-bottom: 12px; }
    .headline-footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ticker-tag {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem; font-weight: 600; letter-spacing: 0.06em;
      padding: 2px 8px; border-radius: 3px;
      background: var(--green-dim); color: var(--green); border: 0.5px solid var(--green-line);
    }

    /* ── Chart tooltip ── */
    #chartTooltip {
      position: fixed; background: var(--tooltip-bg);
      border: 0.5px solid var(--border); border-radius: 6px;
      padding: 10px 14px;
      font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
      color: var(--text-1);
      pointer-events: none; opacity: 0; transition: opacity 0.1s;
      z-index: 100; max-width: 280px;
    }
    #chartTooltip .tt-score { font-size: 0.65rem; font-weight: 600; margin-bottom: 4px; }
    #chartTooltip .tt-headline { color: var(--text-1); line-height: 1.4; }
    #chartTooltip .tt-source { color: var(--text-3); font-size: 0.62rem; margin-top: 4px; }

    /* ── Chart scroll wrapper ── */
    #chartSvgContainer {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .chart-scroll-hint {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.6rem; color: var(--text-3);
      letter-spacing: 0.06em; text-align: center;
      margin-top: 8px;
    }

    /* ── Mobile: chart labels only ── */
    @media (max-width: 600px) {
      .axis-label { font-size: 12px; }
    }
  </style>
</head>
<body>

  <nav class="topnav">
    <a href="/">Earnings</a>
    <a href="/news" class="active">News</a>
    <button class="theme-toggle" id="themeToggle">◐ LIGHT</button>
  </nav>

  <h1>Market News</h1>

  <!-- Carousel nav — hidden until data loads -->
  <div class="carousel-nav" id="carouselNav" hidden>
    <button class="nav-btn" id="prevWeek">‹ PREV</button>
    <div class="week-info">
      <div id="weekLabel" class="week-label"></div>
      <div id="weekCounter" class="week-counter"></div>
    </div>
    <button class="nav-btn" id="nextWeek">NEXT ›</button>
  </div>

  <div class="report-meta" id="reportMeta">Loading…</div>

  <div id="carouselContent">
    <div class="chart-card">
      <div class="chart-card-title">Sentiment Score by Article</div>
      <div id="chartSvgContainer"></div>
    </div>
    <div class="stats-row" id="statsRow"></div>
    <div class="feed" id="feed"></div>
  </div>

  <div id="chartTooltip">
    <div class="tt-score" id="ttScore"></div>
    <div class="tt-headline" id="ttHeadline"></div>
    <div class="tt-source" id="ttSource"></div>
  </div>

<script>
// Theme toggle
(function() {
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  function syncLabel() {
    btn.textContent = root.dataset.theme === 'light' ? '◑ DARK' : '◐ LIGHT';
  }
  syncLabel();
  btn.addEventListener('click', function() {
    const isLight = root.dataset.theme === 'light';
    root.dataset.theme = isLight ? 'dark' : 'light';
    localStorage.setItem('theme', isLight ? 'dark' : 'light');
    syncLabel();
  });
})();

const LABELS = {
  2: "Very Positive", 1: "Positive", 0: "Neutral", "-1": "Negative", "-2": "Very Negative"
};
const PILL_CLASS = {
  2: "pill-s2", 1: "pill-s1", 0: "pill-s0", "-1": "pill-sn1", "-2": "pill-sn2"
};
const CARD_CLASS = {
  2: "s2", 1: "s1", 0: "s0", "-1": "sn1", "-2": "sn2"
};

// ── Carousel state ────────────────────────────────────────────────────────────
let allWeeks = [];   // newest first
let currentIdx = 0; // 0 = most recent

function updateCarouselNav() {
  const total = allWeeks.length;
  const run = allWeeks[currentIdx];

  document.getElementById('weekLabel').textContent = run.period;
  document.getElementById('weekCounter').textContent =
    `week ${total - currentIdx} of ${total}`;

  document.getElementById('prevWeek').disabled = currentIdx >= total - 1;
  document.getElementById('nextWeek').disabled = currentIdx <= 0;
}

function navigate(delta) {
  // delta = +1 → older week, -1 → newer week
  const newIdx = currentIdx + delta;
  if (newIdx < 0 || newIdx >= allWeeks.length) return;

  const content = document.getElementById('carouselContent');
  content.classList.add('fading');

  setTimeout(() => {
    currentIdx = newIdx;
    renderWeek(allWeeks[currentIdx]);
    updateCarouselNav();
    content.classList.remove('fading');
  }, 180);
}

// Swipe support
(function() {
  let tx = 0, ty = 0;
  const el = document.getElementById('carouselContent');
  el.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
  }, { passive: true });
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      navigate(dx < 0 ? 1 : -1); // swipe left = older, swipe right = newer
    }
  }, { passive: true });
})();

document.getElementById('prevWeek').addEventListener('click', () => navigate(1));
document.getElementById('nextWeek').addEventListener('click', () => navigate(-1));

// ── Rendering ─────────────────────────────────────────────────────────────────

function buildChart(NEWS) {
  const container = document.getElementById("chartSvgContainer");
  const containerW = Math.max(260, Math.floor(container.getBoundingClientRect().width));
  const MIN_SPACING = Math.max(36, Math.ceil(containerW / 10)); // ~10 articles visible; scales to container
  const W = Math.max(containerW, NEWS.length * MIN_SPACING);
  const scrollable = W > containerW;
  const mobile = containerW < 520;
  const H = mobile ? 240 : 210;
  const PAD = { top: 20, right: mobile ? 16 : 28, bottom: mobile ? 44 : 44, left: mobile ? 40 : 44 };
  const dotR = mobile ? 7 : 5;
  const IW = W - PAD.left - PAD.right;
  const IH = H - PAD.top - PAD.bottom;
  const Y_MIN = -2, Y_MAX = 2;
  const n = NEWS.length;

  function xPos(i) {
    return PAD.left + (n === 1 ? IW / 2 : (i / (n - 1)) * IW);
  }
  function yPos(score) {
    return PAD.top + IH - ((score - Y_MIN) / (Y_MAX - Y_MIN)) * IH;
  }

  const zeroY = yPos(0);

  let gridLines = "", yLabels = "";
  [-2, -1, 0, 1, 2].forEach(tick => {
    const y = yPos(tick);
    const cls = tick === 0 ? "zero-line" : "grid-line";
    gridLines += `<line class="${cls}" x1="${PAD.left}" y1="${y}" x2="${W - PAD.right}" y2="${y}" />`;
    yLabels += `<text class="axis-label" x="${PAD.left - 8}" y="${y + 4}" text-anchor="end">${tick > 0 ? "+" : ""}${tick}</text>`;
  });

  const pts = NEWS.map((item, i) => [xPos(i), yPos(item.sentiment_score)]);
  const linePts = pts.map(p => `${p[0]},${p[1]}`).join(" L ");
  const areaD = `M ${pts[0][0]},${zeroY} L ${linePts} L ${pts[pts.length - 1][0]},${zeroY} Z`;

  const SCORE_COLOR = { 2: "#00e664", 1: "rgba(0,230,100,0.6)", 0: "#555", "-1": "#f97316", "-2": "#ef4444" };

  const xLabels = NEWS.map((item, i) =>
    `<text class="axis-label" x="${xPos(i)}" y="${H - PAD.bottom + 16}" text-anchor="middle">${i + 1}</text>`
  ).join("");

  const dots = NEWS.map((item, i) => {
    const cx = xPos(i), cy = yPos(item.sentiment_score);
    const col = SCORE_COLOR[item.sentiment_score] || "#818cf8";
    const hl = item.headline.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    const src = item.source.replace(/'/g, "\\'");
    const scoreLabel = LABELS[item.sentiment_score];
    return `<circle class="chart-dot" cx="${cx}" cy="${cy}" r="${dotR}" fill="${col}"
      onmouseenter="showChartTip(event,${item.sentiment_score},'${scoreLabel}','${hl}','${src}')"
      onmouseleave="hideChartTip()" />`;
  }).join("");

  const svgWidth = scrollable ? `${W}px` : '100%';
  document.getElementById("chartSvgContainer").innerHTML = `
    <svg id="sentimentChart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:${svgWidth};min-width:${W}px;display:block">
      <defs>
        <clipPath id="clipAbove">
          <rect x="${PAD.left - 1}" y="${PAD.top}" width="${IW + 2}" height="${zeroY - PAD.top}" />
        </clipPath>
        <clipPath id="clipBelow">
          <rect x="${PAD.left - 1}" y="${zeroY}" width="${IW + 2}" height="${PAD.top + IH - zeroY + 1}" />
        </clipPath>
      </defs>
      ${gridLines}
      ${yLabels}
      ${xLabels}
      <path d="${areaD}" fill="#00e664" fill-opacity="0.12" clip-path="url(#clipAbove)" />
      <path d="${areaD}" fill="#ef4444" fill-opacity="0.14" clip-path="url(#clipBelow)" />
      <polyline fill="none" stroke="#00e664" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
        points="${pts.map(p => p.join(",")).join(" ")}" />
      ${dots}
    </svg>`;

  // Show/hide scroll hint
  const existingHint = container.parentElement.querySelector('.chart-scroll-hint');
  if (existingHint) existingHint.remove();
  if (scrollable) {
    const hint = document.createElement('div');
    hint.className = 'chart-scroll-hint';
    hint.textContent = '← scroll to see all articles →';
    container.parentElement.appendChild(hint);
  }

  document.getElementById("sentimentChart").addEventListener("mousemove", e => {
    const tip = document.getElementById("chartTooltip");
    tip.style.left = (e.clientX + 16) + "px";
    tip.style.top  = (e.clientY - 48) + "px";
  });
}

function showChartTip(e, score, label, headline, source) {
  const SCORE_COLOR = { 2: "#00e664", 1: "rgba(0,230,100,0.6)", 0: "#555", "-1": "#f97316", "-2": "#ef4444" };
  const tip = document.getElementById("chartTooltip");
  const col = SCORE_COLOR[score] || "#94a3b8";
  document.getElementById("ttScore").innerHTML =
    `<span style="color:${col}">${score > 0 ? "+" : ""}${score} — ${label}</span>`;
  document.getElementById("ttHeadline").textContent = headline;
  document.getElementById("ttSource").textContent = source;
  tip.style.opacity = "1";
  tip.style.left = (e.clientX + 16) + "px";
  tip.style.top  = (e.clientY - 48) + "px";
}

function hideChartTip() {
  document.getElementById("chartTooltip").style.opacity = "0";
}

function renderStats(NEWS) {
  const dist = {2:0, 1:0, 0:0, "-1":0, "-2":0};
  NEWS.forEach(n => dist[n.sentiment_score]++);
  const weighted = (NEWS.reduce((s, n) => s + n.sentiment_score, 0) / NEWS.length).toFixed(1);

  document.getElementById("statsRow").innerHTML = [
    { key: 2,    label: "Very Positive", cls: "very-positive" },
    { key: 1,    label: "Positive",      cls: "positive" },
    { key: 0,    label: "Neutral",       cls: "neutral" },
    { key: "-1", label: "Negative",      cls: "negative" },
    { key: "-2", label: "Very Negative", cls: "very-negative" },
  ].filter(s => dist[s.key] > 0).map(s =>
    `<div class="stat-chip ${s.cls}"><div class="stat-val">${dist[s.key]}</div><div class="stat-lbl">${s.label}</div></div>`
  ).join("") +
  `<div class="stat-chip"><div class="stat-val">${weighted}</div><div class="stat-lbl">Avg Score</div></div>`;
}

function renderFeed(NEWS) {
  document.getElementById("feed").innerHTML = NEWS.map(n => {
    const titleHtml = n.url
      ? `<a href="${n.url}" target="_blank" rel="noopener">${n.headline}</a>`
      : n.headline;
    const unverified = !n.url_verified
      ? `<span class="unverified-badge">⚠ Unverified source</span>`
      : "";
    const tickers = (n.stocks_mentioned || []).map(t => `<span class="ticker-tag">${t}</span>`).join("");
    return `
      <div class="headline-card ${CARD_CLASS[n.sentiment_score]}">
        <div class="headline-top">
          <div class="headline-text">${titleHtml}</div>
          <span class="sentiment-pill ${PILL_CLASS[n.sentiment_score]}">${LABELS[n.sentiment_score]}</span>
        </div>
        <div class="headline-source">${n.source}${unverified}</div>
        <div class="headline-summary">${n.summary}</div>
        ${tickers ? `<div class="headline-footer">${tickers}</div>` : ""}
      </div>`;
  }).join("");
}

function renderWeek(run) {
  const NEWS = run.headlines || [];

  document.getElementById('reportMeta').textContent =
    `${run.period} · AI & Stock Market`;

  if (!NEWS.length) {
    document.getElementById('chartSvgContainer').innerHTML = '';
    document.getElementById('statsRow').innerHTML = '';
    document.getElementById('feed').innerHTML =
      `<p style="color:var(--text-3);font-family:'IBM Plex Mono',monospace;font-size:0.75rem;padding:20px 0">` +
      `No articles for this week.</p>`;
    return;
  }

  buildChart(NEWS);
  renderStats(NEWS);
  renderFeed(NEWS);
}

async function loadAndRender() {
  try {
    const resp = await fetch('/api/news' + (window.API_EXT || ''));
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    allWeeks = await resp.json();

    if (!allWeeks.length) {
      document.getElementById('reportMeta').textContent =
        'No data — run python ingest_news.py to fetch headlines';
      document.getElementById('feed').innerHTML =
        `<p style="color:var(--text-3);font-family:'IBM Plex Mono',monospace;font-size:0.75rem;padding:20px 0">` +
        `Run <code>python ingest_news.py</code> to populate the news feed.</p>`;
      return;
    }

    currentIdx = 0;
    renderWeek(allWeeks[0]);

    if (allWeeks.length > 1) {
      document.getElementById('carouselNav').hidden = false;
      updateCarouselNav();
    }
  } catch (err) {
    document.getElementById('reportMeta').textContent = 'Failed to load';
    document.getElementById('feed').innerHTML =
      `<p style="color:#f97316;font-family:'IBM Plex Mono',monospace;font-size:0.75rem;padding:20px 0">` +
      `Error loading news: ${err.message}</p>`;
  }
}

loadAndRender();

let _resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => {
    if (allWeeks.length) buildChart(allWeeks[currentIdx].headlines || []);
  }, 150);
});
</script>
</body>
</html>
