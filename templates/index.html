<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earnings Report Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 32px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 40px;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 28px 32px;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead th {
      text-align: left;
      padding: 8px 16px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #64748b;
      border-bottom: 1px solid #2d3148;
    }

    tbody tr:hover { background: #252840; }

    tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid #1a1d2e;
      color: #cbd5e1;
    }

    tbody td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
      font-weight: 500;
    }

    .ticker {
      display: inline-block;
      background: #2d3148;
      color: #818cf8;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.04em;
    }

    .empty {
      text-align: center;
      color: #475569;
      padding: 48px 0;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <h1>Earnings Dashboard</h1>
  <p class="subtitle">Revenue by company and period — figures in billions USD</p>

  <div class="card">
    <div class="card-title">Revenue Table</div>
    <table id="revenueTable">
      <thead>
        <tr>
          <th>Company</th>
          <th>Ticker</th>
          <th>Period</th>
          <th style="text-align:right">Revenue</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="4" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>

<script>
function fmtB(thousands) {
  return "$" + (thousands / 1_000_000).toFixed(3) + "B";
}

async function init() {
  const rows = await fetch("/api/revenue").then(r => r.json());

  const tbody = document.getElementById("tableBody");

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="empty">No data — run main.py against a 10-Q first.</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.name}</td>
      <td><span class="ticker">${r.ticker}</span></td>
      <td>${r.period}</td>
      <td class="num">${fmtB(r.revenue)}</td>
    </tr>
  `).join("");
}

init();
</script>
</body>
</html>
